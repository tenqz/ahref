[package]
name = "ahref"
description = "A Rust CLI crawler that turns a website into a directed link graph"
authors = ["tenqz"]
version = "1.0.0"
edition = "2021"
rust-version = "1.90"
repository = "https://github.com/tenqz/ahref"
readme = "README.md"
keywords = ["cli", "crawler", "graph", "links", "html"]
categories = ["command-line-utilities", "web-programming"]
license = "MIT"
include = ["Cargo.lock", "Cargo.toml", "src/**", "tests/**", "README.md", "CHANGELOG.md", "LICENSE", "CONTRIBUTING.md", "SECURITY.md", "CODE_OF_CONDUCT.md", "docs/**"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
encoding_rs = "0.8"
flate2 = "1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate", "stream"] }
robotstxt = "0.3"
roxmltree = "0.21"
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "net", "io-util"] }
url = { version = "2.5", features = ["serde"] }
