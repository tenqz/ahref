name: Release artifacts

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install supported Rust
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - name: Validate version tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(cargo +1.90.0 metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          test "$GITHUB_REF_NAME" = "v$version"
      - run: cargo +1.90.0 fmt --check
      - run: cargo +1.90.0 clippy --locked --all-targets -- -D warnings
      - run: cargo +1.90.0 test --locked
      - run: cargo +1.90.0 build --release --locked
      - run: cargo +1.90.0 package --locked
      - name: Assemble Linux archive
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/ahref LICENSE README.md dist/
          mkdir -p dist/docs/assets
          cp -r docs/. dist/docs/
          cp CONTRIBUTING.md SECURITY.md CODE_OF_CONDUCT.md CHANGELOG.md dist/
          tar -czf ahref-linux-x86_64.tar.gz -C dist .
          cp target/package/*.crate .
          sha256sum ahref-linux-x86_64.tar.gz ahref-*.crate > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ahref-linux-x86_64
          path: |
            ahref-linux-x86_64.tar.gz
            SHA256SUMS
            ahref-*.crate
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            ahref-linux-x86_64.tar.gz SHA256SUMS ahref-*.crate \
            --verify-tag --title "ahref ${GITHUB_REF_NAME#v}" \
            --notes-file CHANGELOG.md
